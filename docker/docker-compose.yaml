# Docker Compose for Swiss Federal Court Data Generation
# Usage: docker compose -f docker/docker-compose.yaml up

services:
  legal-support:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: legal-support:latest
    container_name: legal-support
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
      - ../output:/app/output:rw
      - ../logs:/app/logs:rw
    environment:
      - LOG_LEVEL=INFO
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 2G
    # Restart policy
    restart: "no"
